<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RC racing timer - No Steward mode with automatic flag delays">
    <title>RKRC Race Control - No Steward</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css?v=1.8.6">
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Race Control">

    <!-- iOS App Icons -->
    <link rel="apple-touch-icon" href="/img/icon-180.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/img/icon-152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/img/icon-180.png">
    <link rel="apple-touch-icon" sizes="167x167" href="/img/icon-167.png">

    <!-- Theme Color -->
    <meta name="theme-color" content="#2f2bb2">

    <!-- Include NoSleep.js to keep screen awake on mobile devices -->
    <script src="js/noSleep.min.js"></script>
</head>
<body>
    <div class="back-button">
        <a href="index.html">Home</a>
    </div>
    <div class="container">
        <img src="img/logo-v4-no-tag.png" width="200" alt="RKRC Logo">
        <h1>Race Control</h1>
        <h2>No Steward Mode</h2>
        <div class="settings">
            <label for="raceTime">Race Minutes:</label>
            <select id="raceTime">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5" selected>5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
            </select>
            <button class="start" id="startRace">Start Race</button>
        </div>
        <div class="practice-mode-section">
            <label for="practiceMode" class="practice-checkbox-label">
                <input type="checkbox" id="practiceMode">
                Practice Mode
            </label>
        </div>
        <div class="drivers-section" id="driversSection" hidden>
            <button type="button" id="pickDrivers" class="drivers-button">Pick drivers</button>
            <div id="driversSummary" class="drivers-summary">No drivers picked</div>
        </div>
        <div class="timer" id="timer">00:00</div>
        <div class="controls">
            <button id="yellowFlag" disabled>Yellow Flag</button>
            <button id="redFlag" disabled>Red Flag</button>
            <button id="restart" disabled>Restart</button>
        </div>
        <div class="voice-selector">
            <label for="voiceSelect">Announcer Voice: </label>
            <select id="voiceSelect">
                <option value="america" selected>American Announcer</option>
                <option value="europe">European Announcer</option>
                <option value="merica">NASCAR</option>
                <option value="dee">Dee Liffy</option>
                <option value="djt">DJT</option>
            </select>
        </div>
        <div class="live-broadcast">
            <label for="liveBroadcast" class="practice-checkbox-label">
                <input type="checkbox" id="liveBroadcast">
                Broadcast live to rkrc.club
            </label>
            <span id="liveStatus" class="live-status"></span>
            <div id="liveTokenForm" class="live-token-form" hidden>
                <input type="password" id="liveToken" placeholder="Broadcast token" autocomplete="off">
                <button type="button" id="liveTokenSave">Save</button>
            </div>
            <button type="button" id="liveTokenChange" class="live-token-change" hidden>Change token</button>
        </div>
        <div id="flagCountDisplay" style="display: none; text-align: center; margin-top: 20px;">
            <!-- Flag counts will be dynamically inserted here -->
        </div>
        <div id="resultsPrompt" class="results-prompt" hidden>
            <button type="button" id="enterResults" class="drivers-button">Enter results</button>
            <div id="resultsStatus" class="live-status"></div>
        </div>
    </div>
    <div id="visualNotificationContainer" style="position: fixed; top: 20%; left: 50%; transform: translateX(-50%); z-index: 999; display: flex; flex-direction: column; align-items: center; pointer-events: none;">
        <!-- Visual notifications will be dynamically inserted here -->
    </div>
    <div class="footer">
        <a href="https://rkrc.club" target="_blank">RKRC</a> - <a href="changelog.html">Changelog</a>
    </div>
    <!-- Include main timer function script -->
    <script src="js/live.js?v=1.8.6"></script>
    <script src="js/drivers.js?v=1.8.6"></script>
    <script src="js/script.js?v=1.8.6"></script>
</body>
</html>
